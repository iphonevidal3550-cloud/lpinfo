<script>
(function(){
  'use strict';

  var BASE_URL = "https://jointvive.com/ds/go/indexvs.php#aff=fvidalx";
  var OWN_HREF_SELECTOR = null;
  var clickFired = false;

  function isEditorPreview(){
    return document.documentElement.classList.contains('flowpages-editor-preview');
  }

  // Os parâmetros da URL atual (utm, fbclid, gclid...) entram ANTES do #,
  // senão eles grudam no "#aff=fvidalx" e corrompem o ID de afiliado.
  function withParams(url){
    if (!url || url === '#') return url;
    var params = new URLSearchParams(window.location.search).toString();
    if (!params) return url;
    var hashIndex = url.indexOf('#');
    var base = hashIndex !== -1 ? url.slice(0, hashIndex) : url;
    var hash = hashIndex !== -1 ? url.slice(hashIndex) : '';
    return base + (base.indexOf('?') !== -1 ? '&' : '?') + params + hash;
  }

  function closestFrom(target, selector){
    if (!target || typeof target.closest !== 'function') return null;
    return target.closest(selector);
  }

  var finalUrl = withParams(BASE_URL);

  var fallbackLink = document.createElement('a');
  fallbackLink.href = finalUrl;
  fallbackLink.target = '_self';
  fallbackLink.className = 'ratoeira-trackable';
  fallbackLink.style.display = 'none';

  function doRedirect(){
    if (clickFired || isEditorPreview()) return;
    clickFired = true;
    fallbackLink.click();
  }

  function showPopup(){
    var popup = document.getElementById("cookie-popup-modern");
    if (!popup) return;
    popup.style.display = 'flex';
    popup.classList.add("cookie-popup-visible-modern");
  }

  function hasOwnHref(link){
    if (!OWN_HREF_SELECTOR) return false;
    var matches = link.matches || link.msMatchesSelector || link.webkitMatchesSelector;
    if (!matches) return false;
    try {
      return matches.call(link, OWN_HREF_SELECTOR);
    } catch (err) {
      return false;
    }
  }

  function bindAffiliateLinks(root){
    var links = root.querySelectorAll('a[href]');
    Array.prototype.forEach.call(links, function(link){
      if (hasOwnHref(link)){
        // Link por país: mantém o destino próprio, só herda os parâmetros da URL atual.
        var own = link.getAttribute('href') || '';
        link.href = own && own !== '#' ? withParams(own) : finalUrl;
      } else {
        link.href = finalUrl;
      }
      link.addEventListener('click', function(e){
        if (isEditorPreview()){
          e.preventDefault();
          return;
        }
        clickFired = true;
      });
    });
  }

  function initPopup(){
    document.body.appendChild(fallbackLink);
    showPopup();
    var popup = document.getElementById("cookie-popup-modern");
    bindAffiliateLinks(popup || document);
  }

  document.addEventListener('keydown', function(e){
    if (clickFired) return;
    if (e.key === 'Escape'){
      doRedirect();
      return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (closestFrom(document.activeElement, "a[href], button, input, select, textarea, [role=\"button\"]")) return;
    doRedirect();
  });

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initPopup);
  } else {
    initPopup();
  }
})();
</script>
